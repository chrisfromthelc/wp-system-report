name: Release

on:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build release zip
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2
        with:
          php-version: '8.2'
          tools: composer
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-progress

      - name: Build release zip
        run: |
          mkdir wp-system-report
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='tests' \
            --exclude='phpunit.xml.dist' \
            --exclude='phpstan.neon.dist' \
            --exclude='phpstan-bootstrap.php' \
            --exclude='phpcs.xml.dist' \
            --exclude='rector.php' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='.gitignore' \
            --exclude='node_modules' \
            --exclude='vendor/bin' \
            ./ wp-system-report/
          zip -r wp-system-report.zip wp-system-report/

      - name: Upload release asset
        run: gh release upload "${{ github.event.release.tag_name }}" wp-system-report.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
